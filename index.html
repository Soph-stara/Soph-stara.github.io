<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophie Hamann</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: white;
            color: #e10600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            line-height: 1.6;
        }

        a {
            color: #e10600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Fabric fills the whole screen */
        #fabric-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Text floats on top of the fabric */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        .overlay a {
            pointer-events: auto;
        }

        h1 {
            font-weight: normal;
            font-size: clamp(42px, 9vw, 140px);
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin: 0;
        }

        .tagline {
            max-width: 420px;
            margin-top: 20px;
            opacity: 0.7;
        }

        .navigation {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            font-size: clamp(20px, 3vw, 36px);
        }

        .navigation a {
            background: white;
            padding: 0 6px;
            margin-left: -6px;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
        }

        .footer span,
        .footer a {
            background: white;
            opacity: 0.7;
        }

        .hint {
            position: fixed;
            right: 40px;
            bottom: 40px;
            z-index: 1;
            font-size: 12px;
            opacity: 0.5;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .overlay {
                padding: 20px;
            }

            .hint {
                display: none;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>

<body>
    <div id="fabric-container"></div>

    <div class="overlay">
        <div>
            <h1>Sophie<br>Hamann</h1>
            <p class="tagline">
                researcher &amp; artist working across computation,
                feminist theory and artistic research
            </p>
        </div>

        <div>
            <div class="navigation">
                <a href="portfolio.html">→ portfolio</a>
                <a href="cv.html">→ cv</a>
            </div>
            <div class="footer">
                <span>Living and working in Vienna</span><br>
                <a href="mailto:sophiehamann.maxi@gmail.com">sophiehamann.maxi@gmail.com</a>
            </div>
        </div>
    </div>

    <div class="hint">move / click the fabric</div>

    <script>
        // Fabric simulation, stretched across the whole viewport
        let spacing = 22;
        let cols, rows;

        let lineColor = [225, 6, 0, 100];
        let points = [];
        let gravity = 0.2;
        let damping = 0.98;
        let wave = 0;

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('fabric-container');
            buildFabric();
        }

        function buildFabric() {
            spacing = width < 600 ? 18 : 22;
            cols = ceil(width / spacing) + 3;
            rows = ceil(height / spacing) + 3;

            let offsetX = (width - (cols - 1) * spacing) / 2;
            let offsetY = (height - (rows - 1) * spacing) / 2;

            points = [];
            for (let y = 0; y < rows; y++) {
                points[y] = [];
                for (let x = 0; x < cols; x++) {
                    let fixed = (y === 0 || y === rows - 1 || x === 0 || x === cols - 1);
                    points[y][x] = {
                        x: offsetX + x * spacing,
                        y: offsetY + y * spacing,
                        prevX: offsetX + x * spacing,
                        prevY: offsetY + y * spacing,
                        fixed: fixed
                    };
                }
            }
        }

        function draw() {
            background(255, 255, 255, 30);
            wave += 0.04;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let p = points[y][x];

                    if (!p.fixed) {
                        let vx = (p.x - p.prevX) * damping;
                        let vy = (p.y - p.prevY) * damping;

                        p.prevX = p.x;
                        p.prevY = p.y;

                        // Traveling wave (never settles)
                        let waveForceX = sin(wave + y * 0.3) * 0.4;
                        let waveForceY = cos(wave + x * 0.25) * 0.3;

                        // Perpetual wind noise
                        let wind = sin(wave * 0.7 + x * 0.1) * 0.5;

                        p.x += vx + waveForceX + wind;
                        p.y += vy + gravity + waveForceY;

                        // Mouse pushes the fabric away
                        let dx = mouseX - p.x;
                        let dy = mouseY - p.y;
                        let dist = sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            let force = (120 - dist) / 120;
                            p.x -= dx * force * 0.1;
                            p.y -= dy * force * 0.1;
                        }
                    }
                }
            }

            for (let i = 0; i < 6; i++) {
                applyConstraints();
            }

            stroke(lineColor[0], lineColor[1], lineColor[2], lineColor[3]);
            strokeWeight(0.8);
            noFill();

            for (let y = 0; y < rows; y++) {
                beginShape();
                for (let x = 0; x < cols; x++) {
                    curveVertex(points[y][x].x, points[y][x].y);
                }
                endShape();
            }

            for (let x = 0; x < cols; x++) {
                beginShape();
                for (let y = 0; y < rows; y++) {
                    curveVertex(points[y][x].x, points[y][x].y);
                }
                endShape();
            }
        }

        // Click / tap sends a shockwave through the fabric
        function mousePressed() {
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let p = points[y][x];
                    if (p.fixed) continue;

                    let dx = p.x - mouseX;
                    let dy = p.y - mouseY;
                    let dist = sqrt(dx * dx + dy * dy);

                    if (dist < 300 && dist > 0) {
                        let force = (300 - dist) / 300 * 25;
                        p.prevX -= dx / dist * force;
                        p.prevY -= dy / dist * force;
                    }
                }
            }
        }

        function applyConstraints() {
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let p1 = points[y][x];

                    if (x < cols - 1) {
                        constrainDistance(p1, points[y][x + 1], spacing);
                    }

                    if (y < rows - 1) {
                        constrainDistance(p1, points[y + 1][x], spacing);
                    }
                }
            }
        }

        function constrainDistance(p1, p2, targetDist) {
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = sqrt(dx * dx + dy * dy);

            if (dist > 0) {
                let diff = (targetDist - dist) / dist;
                let offsetX = dx * diff * 0.5;
                let offsetY = dy * diff * 0.5;

                if (!p1.fixed) {
                    p1.x -= offsetX;
                    p1.y -= offsetY;
                }

                if (!p2.fixed) {
                    p2.x += offsetX;
                    p2.y += offsetY;
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            buildFabric();
        }
    </script>
</body>
</html>
